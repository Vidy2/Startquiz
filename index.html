<!DOCTYPE html>
<html lang = "en">
<head>
  .card {
    position: fixed;
    left: 50vw;
    top: 50vw;
    width: 30vw;
    height: 40vw;
  }
  <title>Quiznet</title>
</head>
<body>
  <button class = "card" id="front" style = "z-index:1;">
    Front
  </button onclick="flip(this)">
  <button class = "card" id="back" style = "z-index:0;">
    Back
  </button onclick="flip(this)">
  <script>
    function flip(element){
      element.style.zIndex = window.getComputedStyle(element).zIndex() + 2;
    }
  </script>
</body>
