<!DOCTYPE html>
<html lang = "en">
<head>
  <title>Quiznet</title>
</head>
<body>
  <button id="front" style = "z-index:1;">
    Front
  </button onclick="flip(this)">
  <button id="back" style = "z-index:0;">
    Back
  </button onclick="flip(this)">
  <script>
    function flip(element){
      element.style.zIndex = window.getComputedStyle(element).zIndex() + 2;
    }
  </script>
</body>
