<!DOCTYPE html>
<html lang = "en">
<head>
  <style>
    .card {
      position: relative;
      left: 50vw;
      top: 50vw;
      width: 20vw;
      height: 10vw;
      background-color: gray;
    }
  </style>
  <title>Quiznet</title>
</head>
<body>
  <button class = "card" id="front" style = "z-index:1;" onclick="flip(this)">
    Front
  </button>
  <button class = "card" id="back" style = "z-index:0;" onclick="flip(this)">
    Back
  </button>
  <script>
    function flip(element){
      element.style.zIndex = window.getComputedStyle(element).zIndex() + 2;
    }
  </script>
</body>
