<!DOCTYPE html>
<html lang = "en">
<head>
  <style>
    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20vw;
      height: 10vw;
      background-color: gray;
    }
  </style>
  <title>Quiznet</title>
</head>
<body>
  <button class = "card" id="front" style = "z-index:1;" onclick="flip(this)">
    Front
  </button>
  <button class = "card" id="back" style = "z-index:0;" onclick="flip(this)">
    Back
  </button>
  <script>
    let currentZ = 2
    function flip(element){
      element.style.zIndex = currentZ;
      currentZ++;
    }
  </script>
</body>
